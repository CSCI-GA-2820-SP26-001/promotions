apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: cd-template
  labels:
    app: promotions
spec:
  params:
    - name: repo-url
      description: Git repository URL from the webhook payload.
    - name: branch
      default: master
      description: Git branch name from the webhook payload.
    - name: image-name
      # Replace YOUR_PROJECT with your OpenShift project/namespace name
      default: image-registry.openshift-image-registry.svc:5000/sushant-b-dev/promotions:latest
    - name: base-url
      # Replace with your OpenShift route URL, e.g. https://promotions-YOUR_PROJECT.apps.cluster.example.com
      default: https://promotions-sushant-b-dev.apps.rm1.0a51.p1.openshiftapps.com
  resourceTemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: cd-pipeline-run-
        labels:
          app: promotions
      spec:
        pipelineRef:
          name: cd-pipeline
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: branch
            value: $(tt.params.branch)
          - name: image-name
            value: $(tt.params.image-name)
          - name: base-url
            value: $(tt.params.base-url)
        workspaces:
          - name: pipeline-workspace
            persistentVolumeClaim:
              claimName: pipeline-workspace
