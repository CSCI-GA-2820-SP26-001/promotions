apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
  labels:
    app: promotions
spec:
  description: CD pipeline for the Promotions service.
  params:
    - name: repo-url
      type: string
      description: GitHub repository URL.
    - name: branch
      type: string
      default: master
      description: Branch to build from.
    - name: image-name
      type: string
      description: Full image path including registry, name, and tag.
  workspaces:
    - name: pipeline-workspace

  tasks:
    # -------------------------------------------------------
    # 1. Clone — Story #1 (Yash)
    # -------------------------------------------------------
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
      workspaces:
        - name: output
          workspace: pipeline-workspace

