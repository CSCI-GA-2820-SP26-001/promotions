apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: cd-pipeline-run-
  labels:
    app: promotions
spec:
  pipelineRef:
    name: cd-pipeline
  params:
    - name: repo-url
      value: https://github.com/CSCI-GA-2820-SP26-001/promotions
    - name: branch
      value: master
    - name: image-name
      value: image-registry.openshift-image-registry.svc:5000/sushant-b-dev/promotions:latest
    - name: base-url
      value: https://promotions-sushant-b-dev.apps.rm1.0a51.p1.openshiftapps.com
  workspaces:
    - name: pipeline-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
