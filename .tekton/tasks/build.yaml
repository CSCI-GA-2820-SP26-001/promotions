apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
  labels:
    app: promotions
spec:
  description: Builds a container image from a Dockerfile and pushes it to the registry.
  params:
    - name: IMAGE
      type: string
      description: Full image name to build and push (e.g. image-registry.openshift-image-registry.svc:5000/project/promotions:latest).
  workspaces:
    - name: source
      description: The workspace containing the cloned repository.
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.0
      workingDir: $(workspaces.source.path)
      env:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: DOCKER_CONFIG
          value: /kaniko/.docker
      volumeMounts:
        - name: registry-credentials
          mountPath: /kaniko/.docker
      args:
        - --dockerfile=Dockerfile
        - --context=$(workspaces.source.path)
        - --destination=$(params.IMAGE)
        - --insecure
        - --skip-tls-verify
  volumes:
    - name: registry-credentials
      secret:
        secretName: registry-credentials
        items:
          - key: .dockerconfigjson
            path: config.json
