apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  labels:
    app: promotions
spec:
  description: Clones a Git repository into the pipeline workspace.
  params:
    - name: url
      type: string
      description: Git repository URL to clone.
    - name: revision
      type: string
      default: master
      description: Branch, tag, or commit SHA to check out.
  workspaces:
    - name: output
      description: The workspace to clone the repository into.
  steps:
    - name: clone
      image: alpine/git:2.43.0
      env:
        - name: WORKSPACE_PATH
          value: $(workspaces.output.path)
        - name: PARAM_URL
          value: $(params.url)
        - name: PARAM_REVISION
          value: $(params.revision)
      script: |
        #!/bin/sh
        set -eu

        find "${WORKSPACE_PATH}" -mindepth 1 -delete

        git clone \
          --depth 1 \
          --branch "${PARAM_REVISION}" \
          "${PARAM_URL}" \
          "${WORKSPACE_PATH}"

        cd "${WORKSPACE_PATH}"
        echo "Cloned: ${PARAM_URL}"
        echo "Branch: ${PARAM_REVISION}"
        echo "Commit: $(git rev-parse HEAD)"
