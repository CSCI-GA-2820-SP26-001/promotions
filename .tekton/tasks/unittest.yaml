apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-test
  labels:
    app: promotions
spec:
  description: Runs pytest with coverage checks.
  workspaces:
    - name: source
      description: The workspace containing the cloned repository.
  steps:
    - name: unit-test
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: FLASK_APP
          value: "wsgi:app"
        - name: DATABASE_URI
          value: "postgresql+psycopg://postgres:pgs3cr3t@postgres:5432/postgres"
      script: |
        #!/bin/sh
        set -eu
        pip install pipenv --quiet
        pipenv install --system --dev --quiet
        echo "Running unit tests..."
        pytest --pspec --cov=service --cov-fail-under=95 --disable-warnings
        echo "Unit tests passed."
