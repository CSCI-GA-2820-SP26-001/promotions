apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: cd-template
  labels:
    app: promotions
spec:
  params:
    - name: repo-url
      description: Git repository URL from the webhook payload.
    - name: branch
      default: refs/heads/master
      description: Git ref from the webhook payload.
    - name: image-name
      # Replace YOUR_PROJECT with your OpenShift project/namespace name
      default: image-registry.openshift-image-registry.svc:5000/YOUR_PROJECT/promotions:latest
  resourceTemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: cd-pipeline-run-
        labels:
          app: promotions
      spec:
        pipelineRef:
          name: cd-pipeline
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: branch
            value: $(tt.params.branch)
          - name: image-name
            value: $(tt.params.image-name)
        workspaces:
          - name: pipeline-workspace
            persistentVolumeClaim:
              claimName: pipeline-workspace
