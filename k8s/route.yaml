# OpenShift Route — exposes the Promotions service outside the cluster
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: promotions
  labels:
    app: promotions
spec:
  to:
    kind: Service
    name: promotions
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
